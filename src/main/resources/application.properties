# Every value below is read from an environment variable, with a default that makes the
# service runnable on a clean machine without setting anything. The ${VAR:default} form is
# the whole of factor III in this project: the code never reads a variable directly, and no
# deployment needs a different build.

# --- Factor VII: port binding -------------------------------------------------------------
# The embedded server is a dependency of the application, not a container it is deployed into.
# PORT is what a platform sets, so the service reads that rather than assuming 8080.
server.port=${PORT:8080}

# --- Factor IX: disposability -------------------------------------------------------------
# On a termination signal, stop accepting connections and let in-flight requests finish.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:20s}

# --- Factor XI: logs ----------------------------------------------------------------------
# Spring Boot writes to stdout by default. No file appender is configured anywhere in this
# project, and that is a decision rather than an omission: the process writes an event stream
# and the environment decides what to do with it.
logging.level.root=${LOG_LEVEL:INFO}
logging.level.edu.jala.ygocards=${APP_LOG_LEVEL:INFO}

# --- Factor IV: the upstream card API as an attached resource -----------------------------
ygo.upstream.base-url=${YGO_API_BASE_URL:https://db.ygoprodeck.com/api/v7}
ygo.upstream.image-base-url=${YGO_IMAGE_BASE_URL:https://images.ygoprodeck.com/images}
ygo.upstream.probe-path=${YGO_PROBE_PATH:/checkDBVer.php}
ygo.upstream.probe-ttl=${UPSTREAM_PROBE_TTL:30s}
ygo.upstream.rate-limit-per-second=${YGO_RATE_LIMIT_PER_SECOND:8}
ygo.upstream.rate-limit-wait=${YGO_RATE_LIMIT_WAIT:500ms}
ygo.upstream.connect-timeout=${YGO_CONNECT_TIMEOUT:3s}
ygo.upstream.read-timeout=${YGO_READ_TIMEOUT:5s}

# --- Factors IV and VI: bounded, disposable in-memory caches ------------------------------
ygo.cache.card-ttl=${CACHE_CARD_TTL:15m}
ygo.cache.card-max-entries=${CACHE_CARD_MAX_ENTRIES:500}
ygo.cache.image-ttl=${CACHE_IMAGE_TTL:1h}
ygo.cache.image-max-entries=${CACHE_IMAGE_MAX_ENTRIES:200}

# --- Build identity reported by /health ---------------------------------------------------
# Filled by Maven at build time from the project version, so the running process can say which
# build it is without anyone editing a constant.
app.version=@project.version@
